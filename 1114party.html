<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIYU · 11/14 코디 3벌</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111; --paper:#f1efe9; --sub:#4a4a4a;
  --disp:"Bricolage Grotesque","Pretendard",sans-serif;
  --body:"Pretendard",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b0b;color:var(--ink);font-family:var(--body);overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;background:#d8d8d6;user-select:none;-webkit-user-select:none}

/* 상단 */
.top{position:absolute;inset:0 0 auto 0;z-index:30;padding:8px 10px 0;pointer-events:none}
.top.solid{background:var(--paper);padding-bottom:10px;box-shadow:0 1px 0 rgba(17,17,17,.08)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;pointer-events:auto}
.bar{height:44px;display:flex;flex-direction:column;gap:7px;padding-top:2px;text-align:left}
.bar i{display:block;height:3px;border-radius:3px;background:rgba(17,17,17,.2);overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0;width:0;background:var(--ink);border-radius:3px;transition:width .25s}
.bar span{font:600 12px/1 var(--body);letter-spacing:.02em;color:rgba(17,17,17,.6)}
.bar.on span{color:var(--ink)}
.who{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.who .id{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--disp);letter-spacing:.01em}
.who .id small{font:500 12px/1 var(--body);color:var(--sub);letter-spacing:0}
.chip-ad{font:700 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--ink);color:#fff}

/* 슬라이드 */
.stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .28s ease, visibility 0s .28s}
.slide.on{opacity:1;visibility:visible;transition:opacity .28s ease}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}

.num{position:absolute;left:14px;top:104px;z-index:3;font:800 76px/.82 var(--disp);letter-spacing:-.05em;color:var(--ink)}
.num small{display:block;font:600 12px/1 var(--body);letter-spacing:.14em;margin:0 0 8px 3px;color:var(--sub)}
.tags{position:absolute;right:4px;top:112px;bottom:52px;z-index:4;width:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.tag{display:flex;flex-direction:column;align-items:center;width:150px;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.slide.on .tag:nth-child(2){animation-delay:.12s}
.slide.on .tag:nth-child(3){animation-delay:.24s}.slide.on .tag:nth-child(4){animation-delay:.36s}
.tags.n3 .tag .stk{width:96px;height:104px}
.tags.n4{top:104px;bottom:44px}.tags.n4 .tag .stk{width:74px;height:80px}
.tags.n4 .tag .nm{font-size:12px;padding:4px 7px;margin-top:2px}.tags.n4 .tag .go{min-height:34px;font-size:12px;padding:0 11px;margin-top:4px}
.slide:not(.on) .tag{animation:none}
.tag .stk{width:118px;height:132px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));transform:rotate(var(--r,4deg));transition:transform .2s}
.tag:active .stk{transform:rotate(0) scale(.94)}
.tag .nm{margin-top:4px;font:700 13px/1.3 var(--body);text-align:center;word-break:keep-all;color:var(--ink);background:rgba(255,255,255,.88);padding:5px 8px;border-radius:8px}
.tag .go{margin-top:5px;min-height:38px;display:inline-flex;align-items:center;gap:4px;font:700 13px/1 var(--body);color:#fff;background:var(--ink);padding:0 12px;border-radius:99px}
.tag .go::after,.mgo::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);margin-left:2px}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}

/* 한눈에 */
.over{background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.over-in{padding:98px 10px 46px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:start}
.ohead{display:block;width:100%;text-align:left}
.onum{display:flex;align-items:baseline;gap:4px;margin:0 0 6px 2px;font:800 26px/1 var(--disp);letter-spacing:-.04em}
.onum small{font:600 12px/1 var(--body);letter-spacing:.1em;color:var(--sub)}
.oph{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;object-position:50% 40%;border-radius:12px;background:#d8d8d6;transition:transform .2s}
.ohead:active .oph{transform:scale(.97)}
.minis{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.mini{display:block;background:#fff;border-radius:12px;padding:6px 6px 7px}
.mtop{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.mini img{flex:none;min-width:0;width:44px;height:44px;object-fit:contain;transform:rotate(var(--r,3deg));filter:drop-shadow(0 2px 4px rgba(0,0,0,.14))}
.mgo{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;padding:7px 7px 7px 9px;border-radius:99px;background:var(--ink);color:#fff;font:700 12px/1 var(--body)}
.mn{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:5px;font:700 12px/1.3 var(--body);word-break:keep-all}
.over.n1 .oph,.over.n2 .oph{aspect-ratio:9/22}.over.n3 .oph{aspect-ratio:9/17}
.over.n1 .mini img,.over.n2 .mini img{width:54px;height:58px}
.over.n4 .mini img{width:36px;height:36px}
.fine{margin-top:16px;font:500 12px/1.4 var(--body);color:var(--sub);text-align:center}

/* 법적 고지 한 줄 */
.legal{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:9px 12px 10px;text-align:center;font:500 12px/1.3 var(--body);color:var(--sub);background:rgba(241,239,233,.92);white-space:nowrap}

@media (prefers-reduced-motion:reduce){.tag{animation:none}.slide{transition:none}}
</style>
</head>

  <p class="legal">광고 · 구매 시 수수료를 받아요 · AI 가상인물</p>

<script>
(function(){
  var app=document.getElementById('app'), top=document.getElementById('top');
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var bars=[].slice.call(document.querySelectorAll('.bar'));
  var last=slides.length-1, cur=-1;

  function go(n){
    n=Math.max(0,Math.min(last,n));
    if(n===cur) return;
    cur=n;
    slides.forEach(function(s,i){s.classList.toggle('on',i===n);});
    bars.forEach(function(b,i){b.classList.toggle('on',i===n);b.querySelector('b').style.width=(i<=n?100:0)+'%';});
    top.classList.toggle('solid',n===0);
  }

  var sx=0, sy=0, st=0, moved=false;
  app.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;st=Date.now();moved=false;});
  app.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)moved=true;});
  app.addEventListener('pointerup',function(e){
    if(e.target.closest('a,button')) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3){go(cur+(dx<0?1:-1));return;}
    if(moved || Date.now()-st>450 || cur===0) return;
    var r=app.getBoundingClientRect();
    go(e.clientX-r.left < r.width*0.3 ? cur-1 : cur+1);
  });
  document.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(+g.dataset.go);}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1);
  });
  go(0);
})();
</script>
