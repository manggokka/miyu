<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
  --ink:#111111; --paper:#f1efe9; --sub:#4a4a4a; --line:rgba(17,17,17,.1);
  --disp:"Bricolage Grotesque","Pretendard",sans-serif;
  --body:"Pretendard",-apple-system,system-ui,sans-serif;
  --hd:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--paper);scroll-padding-top:var(--hd)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.page{max-width:480px;margin:0 auto;padding-bottom:40px;background:var(--paper)}

/* 상단 고정 한 줄 */
.hd{position:sticky;top:0;z-index:20;height:var(--hd);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;background:rgba(241,239,233,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.id{display:flex;align-items:baseline;gap:7px;font:800 15px/1 var(--disp);letter-spacing:.01em;white-space:nowrap}
.id small{font:500 12px/1 var(--body);color:var(--sub);letter-spacing:0}
.tabs{display:flex;align-items:center}
.tab{display:flex;align-items:center;justify-content:center;width:42px;height:44px;font:800 14px/1 var(--disp);color:rgba(17,17,17,.45);position:relative}
.tab+.tab::before{content:"";position:absolute;left:-1px;top:50%;width:3px;height:3px;margin-top:-1px;border-radius:50%;background:rgba(17,17,17,.3)}
.tab span{padding:6px 7px;border-radius:99px;transition:background .2s,color .2s}
.tab.on{color:#fff}.tab.on span{background:var(--ink)}
.ad{font:700 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--ink);color:#fff;white-space:nowrap}

/* 룩 블록 */
.look{padding-top:14px}
.look+.look{margin-top:22px;border-top:1px solid var(--line)}
.lab{display:flex;align-items:flex-end;gap:6px;padding:0 16px 10px;font:800 40px/.82 var(--disp);letter-spacing:-.05em}
.lab small{font:600 12px/1 var(--body);letter-spacing:.14em;color:var(--sub);padding-bottom:2px}
.ph{display:block;width:100%;aspect-ratio:9/13;object-fit:cover;object-position:50% 40%;background:#d8d8d6}
/* 사진 위 옷 스티커 (릴스와 같은 느낌, 누르면 상품) */
.phw{position:relative}
.sks{position:absolute;left:10px;top:7%;bottom:7%;width:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.sk{display:block;width:100%;transform:rotate(var(--r,4deg));filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));transition:transform .2s}
.sk{animation:floaty 3.2s ease-in-out infinite}
.sk:nth-child(2){animation-delay:-1.1s}.sk:nth-child(3){animation-delay:-2.1s}.sk:nth-child(4){animation-delay:-.6s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,4deg))}50%{transform:translateY(-7px) rotate(calc(var(--r,4deg) * -0.5))}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sk:active{animation:none;transform:rotate(0) scale(.94)}
.sk img{display:block;width:100%;max-height:30vh;object-fit:contain}
/* 상·하의 크기 균형: 하의 = 상의의 약 70% (릴스 스티커와 같은 규칙) */
.sks .s-bottom{width:66%!important}.sks .s-acc{width:50%!important}.sks .s-cardigan,.sks .s-top{width:88%}
.sks.n1 .sk{width:92%}.sks.n2 .sk{width:86%}.sks.n3 .sk{width:70%}.sks.n3 .sk img{max-height:20vh}.sks.n4 .sk{width:60%}.sks.n4 .sk img{max-height:15vh}
.items{list-style:none;padding:4px 0 0}
.it{display:flex;align-items:center;gap:12px;min-height:76px;padding:8px 14px 8px 12px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it:active{background:rgba(17,17,17,.04)}
.th{flex:none;width:64px;height:66px;display:flex;align-items:center;justify-content:center}
.th img{max-width:100%;max-height:100%;object-fit:contain;transform:rotate(var(--r,4deg));filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.nm{flex:1;min-width:0;font:700 15px/1.35 var(--body);letter-spacing:-.01em;word-break:keep-all}
.go{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 13px 0 14px;border-radius:99px;background:var(--ink);color:#fff;font:700 13px/1 var(--body);white-space:nowrap}
.go::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);margin-left:1px}
.fine{padding:26px 16px 8px;text-align:center;font:500 12px/1.4 var(--body);color:var(--sub)}

/* 법적 고지 한 줄 */
.legal{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:480px;margin:0 auto;padding:9px 12px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font:500 12px/1.3 var(--body);color:var(--sub);background:var(--paper);border-top:1px solid var(--line);white-space:nowrap}
</style>

<script>
(function(){
  var looks=[].slice.call(document.querySelectorAll('.look'));
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var hd=document.querySelector('.hd'), cur=-1;
  function mark(){
    var y=hd.offsetHeight+window.innerHeight*0.3, n=0;
    looks.forEach(function(s,i){if(s.getBoundingClientRect().top<=y)n=i;});
    if((window.innerHeight+window.scrollY)>=document.documentElement.scrollHeight-2) n=looks.length-1;
    if(n===cur)return; cur=n;
    tabs.forEach(function(t,i){t.classList.toggle('on',i===n);});
  }
  tabs.forEach(function(t){t.addEventListener('click',function(e){
    var el=document.querySelector(t.getAttribute('href')); if(!el)return;
    e.preventDefault(); el.scrollIntoView({behavior:'smooth',block:'start'});
    try{history.replaceState(null,'',t.getAttribute('href'));}catch(_){}
  });});
  function jump(){var h=location.hash&&document.getElementById(location.hash.slice(1));if(h)h.scrollIntoView({block:'start'});mark();}
  window.addEventListener('scroll',mark,{passive:true});
  window.addEventListener('resize',mark);
  if(location.hash){jump();window.addEventListener('load',jump);} else mark();
})();
</script>
